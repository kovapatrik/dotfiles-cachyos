# Where pc-tv-notify reports wake/sleep - set by tvTarget in chezmoi.toml
TV_TARGET="{{ .tvTarget }}"
{{ if eq .tvTarget "homeassistant" -}}
# Home Assistant webhook for the "PC power" automation - the webhook ID is the secret
HA_WEBHOOK_URL="{{ .homeassistant.webhookUrl }}"
{{- else -}}
# Homebridge Dummy webhook for the "Gaming PC" button
WEBHOOK_BASE="{{ .homebridge.webhookBase }}"
ACCESSORY_ID="{{ .homebridge.accessoryId }}"
{{- end }}
